name: Snake de contribuciones

# Genera el snake animado del calendario de contribuciones con los colores del
# perfil y lo publica en la rama `output`, de donde lo lee el README.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#ccff00&color_dots=#161b22,#2e3a0a,#5a7300,#99cc00,#ccff00
            dist/snake-light.svg?color_snake=#070706&color_dots=#ebedf0,#e9ffa3,#c2f000,#88b300,#4d6600

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
